<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Habits</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; color: {{text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 2px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Habits</h1>
      <button style="height: 44px; padding: 0 16px; border: 1px solid {{line}}; border-radius: 22px; background: transparent; color: {{text}}; font-size: 14px; font-weight: 600; cursor: pointer">+ Nieuw</button>
    </div>

    <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center">
      <button aria-label="Vorige dag" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{muted}}; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span style="text-align: center; font-size: 15px; font-weight: 600">Vandaag</span>
      <button aria-label="Volgende dag" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{muted}}; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 14px; font-weight: 600">{{summary}}</span>
        <span style="font-size: 13px; color: {{muted}}">{{percent}}%</span>
      </div>
      <div style="height: 8px; border-radius: 4px; background: {{line}}"><div style="{{barStyle}}"></div></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{items}}" as="h" hint-placeholder-count="4">
        <div style="{{h.box}}">
          <button aria-label="{{h.aria}}" aria-pressed="{{h.pressed}}" onClick="{{h.toggle}}" style="{{h.check}}">{{h.mark}}</button>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 16px; font-weight: 600">{{h.name}}</span>
            <span style="font-size: 12px; color: {{muted}}">{{h.meta}}</span>
          </span>
          <span style="font-size: 13px; color: {{muted}}">{{h.streak}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Hoofdnavigatie" style="height: 76px; box-sizing: border-box; border-top: 1px solid {{line}}; background: {{surface}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 10px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <button style="{{n.style}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{n.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.label}}</button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0A0E1A","section":"Kleuren"},"surface":{"editor":"color","default":"#131A2B","section":"Kleuren"},"line":{"editor":"color","default":"#26324F","section":"Kleuren"},"text":{"editor":"color","default":"#F1F4FB","section":"Kleuren"},"muted":{"editor":"color","default":"#9AA6C2","section":"Kleuren"},"accent":{"editor":"color","default":"#C8F135","section":"Kleuren"},"accent2":{"editor":"color","default":"#7C9CFF","section":"Kleuren"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const c = {
      bg: P.bg ?? '#0A0E1A', surface: P.surface ?? '#131A2B', line: P.line ?? '#26324F',
      text: P.text ?? '#F1F4FB', muted: P.muted ?? '#9AA6C2', accent: P.accent ?? '#C8F135', accent2: P.accent2 ?? '#7C9CFF'
    };
    const ACTIVE = 'Habits';
    const defs = [
      ['Home', 'M3 11l9-8 9 8M5 10v10h14V10', 1.75],
      ['Train', 'M7 4l13 8-13 8z', 1.75],
      ['Habits', 'M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5', 1.75],
      ['Progressie', 'M3 17l6-6 4 4 8-9M15 6h6v6', 1.75],
      ['Meer', 'M5 12h.01M12 12h.01M19 12h.01', 3.5]
    ];
    const base = 'border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;cursor:pointer;';
    const nav = defs.map((x) => ({ label: x[0], d: x[1], sw: x[2], style: base + 'color:' + (x[0] === ACTIVE ? c.accent + ';font-weight:600;' : c.muted + ';') }));

    const st = this.state || {};
    const marks = st.marks ?? { 0: true, 1: true, 2: false, 3: false };
    const habits = [
      { name: 'Creatine innemen', meta: 'Elke dag', streak: '12 dagen' },
      { name: 'Eiwitdoel gehaald', meta: 'Elke dag', streak: '5 dagen' },
      { name: '8.000 stappen', meta: 'Elke dag', streak: '2 dagen' },
      { name: 'Mobiliteit 10 min', meta: '3× per week', streak: '1 week' }
    ];
    const items = habits.map((h, i) => {
      const on = !!marks[i];
      return {
        name: h.name, meta: h.meta, streak: h.streak,
        pressed: on ? 'true' : 'false',
        aria: (on ? 'Markeer als niet gedaan: ' : 'Markeer als gedaan: ') + h.name,
        mark: on ? '✓' : '',
        box: 'min-height: 64px; box-sizing: border-box; padding: 0 16px 0 10px; border-radius: 16px; background: ' + c.surface + '; border: 1px solid ' + c.line + '; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 8px;',
        check: 'width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; font-size: 18px; font-weight: 700; cursor: pointer; ' + (on ? 'border: 0; background: ' + c.accent + '; color: ' + c.bg + ';' : 'border: 2px solid ' + c.line + '; background: transparent; color: ' + c.muted + ';'),
        toggle: () => this.setState({ marks: Object.assign({}, marks, { [i]: !on }) })
      };
    });
    const count = habits.filter((h, i) => !!marks[i]).length;
    const pct = Math.round((count / habits.length) * 100);
    return Object.assign({}, c, {
      nav, items,
      summary: count + ' van ' + habits.length + ' gedaan',
      percent: pct,
      barStyle: 'height: 8px; border-radius: 4px; background: ' + c.accent + '; width: ' + pct + '%;'
    });
  }
}
</script>
</body>
</html>
