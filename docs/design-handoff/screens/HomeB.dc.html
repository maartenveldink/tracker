<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; color: {{text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative">
  <div style="flex: 1; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 2px 4px">
      <span style="font-size: 13px; color: {{muted}}">Zondag 8 november</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Vandaag</h1>
    </div>

    <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}">Aan de beurt</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">Benen</span>
        <span style="font-size: 14px; color: {{muted}}">Quadriceps · Hamstrings · Billen</span>
      </div>
      <div style="display: flex; gap: 16px; font-size: 13px; color: {{muted}}">
        <span>6 oefeningen</span>
        <span>ca. 55 min</span>
        <span>Laatst 6 dagen geleden</span>
      </div>
      <button style="height: 56px; border: 0; border-radius: 16px; background: {{accent}}; color: {{bg}}; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
        Start training
      </button>
      <button style="height: 44px; border: 0; background: transparent; color: {{muted}}; font-size: 14px; font-weight: 500; cursor: pointer">Vrije training starten</button>
    </div>

    <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 14px; font-weight: 600">Deze week</span>
        <span style="font-size: 13px; color: {{muted}}">2 van 3 sessies</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <span style="font-size: 12px; color: {{muted}}">{{d.label}}</span>
            <span style="{{d.dot}}">{{d.mark}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700">3</span>
        <span style="font-size: 12px; color: {{muted}}">weken streak</span>
      </div>
      <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: {{muted}}">Volume</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700">12,4k</span>
        <span style="font-size: 12px; color: {{accent2}}">↑ 8% t.o.v. vorige wk</span>
      </div>
      <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: {{muted}}">Gewicht</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700">82,4</span>
        <button style="align-self: flex-start; height: 28px; padding: 0 10px; border: 1px solid {{line}}; border-radius: 14px; background: transparent; color: {{text}}; font-size: 12px; cursor: pointer">+ Log</button>
      </div>
    </div>

    <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 14px; font-weight: 600">Laatst getraind</span>
        <span style="font-size: 13px; color: {{muted}}">per spiergroep</span>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="display: grid; grid-template-columns: 76px minmax(0, 1fr) 64px; align-items: center; gap: 10px">
          <span style="font-size: 14px">{{g.name}}</span>
          <div style="height: 8px; border-radius: 4px; background: {{line}}"><div style="{{g.bar}}"></div></div>
          <span style="font-size: 13px; text-align: right; color: {{g.tone}}">{{g.days}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Hoofdnavigatie" style="height: 76px; box-sizing: border-box; border-top: 1px solid {{line}}; background: {{surface}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 10px">
    <button style="border: 0; background: transparent; color: {{accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home
    </button>
    <button style="border: 0; background: transparent; color: {{muted}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Train
    </button>
    <button style="border: 0; background: transparent; color: {{muted}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg>Habits
    </button>
    <button style="border: 0; background: transparent; color: {{muted}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg>Progressie
    </button>
    <button style="border: 0; background: transparent; color: {{muted}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Meer
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#14110F","section":"Kleuren"},"surface":{"editor":"color","default":"#1F1A17","section":"Kleuren"},"line":{"editor":"color","default":"#3A302A","section":"Kleuren"},"text":{"editor":"color","default":"#F7F0E8","section":"Kleuren"},"muted":{"editor":"color","default":"#B3A599","section":"Kleuren"},"accent":{"editor":"color","default":"#FF7A59","section":"Kleuren"},"accent2":{"editor":"color","default":"#4FD6BE","section":"Kleuren"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const bg = p.bg ?? '#14110F';
    const surface = p.surface ?? '#1F1A17';
    const line = p.line ?? '#3A302A';
    const text = p.text ?? '#F7F0E8';
    const muted = p.muted ?? '#B3A599';
    const accent = p.accent ?? '#FF7A59';
    const accent2 = p.accent2 ?? '#4FD6BE';
    const base = 'width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;';
    const done = base + ' background: ' + accent + '; color: ' + bg + ';';
    const rest = base + ' background: ' + line + '; color: ' + muted + ';';
    const today = base + ' background: transparent; border: 2px solid ' + accent + '; color: ' + accent + ';';
    const days = [
      { label: 'M', dot: done, mark: '✓' },
      { label: 'D', dot: rest, mark: '' },
      { label: 'W', dot: done, mark: '✓' },
      { label: 'D', dot: rest, mark: '' },
      { label: 'V', dot: rest, mark: '' },
      { label: 'Z', dot: rest, mark: '' },
      { label: 'Z', dot: today, mark: '•' }
    ];
    const barBase = 'height: 8px; border-radius: 4px; background: ';
    const groups = [
      { name: 'Benen', days: '6 dagen', tone: accent, bar: barBase + accent + '; width: 86%' },
      { name: 'Schouders', days: '4 dagen', tone: muted, bar: barBase + accent2 + '; width: 57%' },
      { name: 'Borst', days: '3 dagen', tone: muted, bar: barBase + accent2 + '; width: 43%' }
    ];
    return { bg, surface, line, text, muted, accent, accent2, days, groups };
  }
}
</script>
</body>
</html>
