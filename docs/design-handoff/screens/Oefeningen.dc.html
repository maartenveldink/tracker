<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Oefeningen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; color: {{text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 2px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Oefeningen</h1>
      <button style="height: 44px; padding: 0 16px; border: 1px solid {{line}}; border-radius: 22px; background: transparent; color: {{text}}; font-size: 14px; font-weight: 600; cursor: pointer">+ Nieuw</button>
    </div>

    <input aria-label="Zoek een oefening" placeholder="Zoek een oefening" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid {{line}}; border-radius: 24px; background: {{surface}}; color: {{text}}; font-size: 16px">

    <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{rows}}" as="x" hint-placeholder-count="6">
        <button style="min-height: 60px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{line}}; border-radius: 14px; background: {{surface}}; color: {{text}}; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; text-align: left; cursor: pointer">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 600">{{x.name}}</span>
            <span style="font-size: 12px; color: {{muted}}">{{x.group}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
            <span style="font-size: 13px; font-weight: 600">{{x.last}}</span>
            <span style="font-size: 11px; color: {{muted}}">{{x.when}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Hoofdnavigatie" style="height: 76px; box-sizing: border-box; border-top: 1px solid {{line}}; background: {{surface}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 10px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <button style="{{n.style}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{n.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.label}}</button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0A0E1A","section":"Kleuren"},"surface":{"editor":"color","default":"#131A2B","section":"Kleuren"},"line":{"editor":"color","default":"#26324F","section":"Kleuren"},"text":{"editor":"color","default":"#F1F4FB","section":"Kleuren"},"muted":{"editor":"color","default":"#9AA6C2","section":"Kleuren"},"accent":{"editor":"color","default":"#C8F135","section":"Kleuren"},"accent2":{"editor":"color","default":"#7C9CFF","section":"Kleuren"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const c = {
      bg: P.bg ?? '#0A0E1A', surface: P.surface ?? '#131A2B', line: P.line ?? '#26324F',
      text: P.text ?? '#F1F4FB', muted: P.muted ?? '#9AA6C2', accent: P.accent ?? '#C8F135', accent2: P.accent2 ?? '#7C9CFF'
    };
    const ACTIVE = 'Meer';
    const defs = [
      ['Home', 'M3 11l9-8 9 8M5 10v10h14V10', 1.75],
      ['Train', 'M7 4l13 8-13 8z', 1.75],
      ['Habits', 'M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5', 1.75],
      ['Progressie', 'M3 17l6-6 4 4 8-9M15 6h6v6', 1.75],
      ['Meer', 'M5 12h.01M12 12h.01M19 12h.01', 3.5]
    ];
    const base = 'border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;cursor:pointer;';
    const nav = defs.map((x) => ({ label: x[0], d: x[1], sw: x[2], style: base + 'color:' + (x[0] === ACTIVE ? c.accent + ';font-weight:600;' : c.muted + ';') }));
    const cb = 'flex: none; height: 44px; padding: 0 16px; border-radius: 22px; font-size: 14px; cursor: pointer; ';
    const chips = ['Alle', 'Benen', 'Rug', 'Borst', 'Schouders', 'Armen', 'Core'].map((l, i) => ({
      label: l,
      style: cb + (i === 0 ? 'border: 0; background: ' + c.accent + '; color: ' + c.bg + '; font-weight: 700;' : 'border: 1px solid ' + c.line + '; background: transparent; color: ' + c.text + '; font-weight: 500;')
    }));
    const rows = [
      { name: 'Beenpers', group: 'Benen · quadriceps', last: '140 kg × 8', when: '6 dagen geleden' },
      { name: 'Squat', group: 'Benen · quadriceps, billen', last: '100 kg × 8', when: '6 dagen geleden' },
      { name: 'Romeinse deadlift', group: 'Benen · hamstrings', last: '90 kg × 10', when: '6 dagen geleden' },
      { name: 'Optrekken', group: 'Rug · lats', last: '+10 kg × 6', when: '2 dagen geleden' },
      { name: 'Bankdrukken', group: 'Borst', last: '80 kg × 8', when: '3 dagen geleden' },
      { name: 'Schouderpers', group: 'Schouders', last: '30 kg × 10', when: '4 dagen geleden' }
    ];
    return Object.assign({}, c, { nav, chips, rows });
  }
}
</script>
</body>
</html>
