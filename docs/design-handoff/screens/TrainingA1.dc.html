<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Training – A1 Grote kaart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{bg}}; color: {{text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: {{muted}}">Benen · oefening 3 van 6</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">42:18</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="Oefeningen in deze training" style="width: 44px; height: 44px; border: 1px solid {{line}}; border-radius: 22px; background: transparent; color: {{text}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
      </button>
      <button style="height: 44px; padding: 0 18px; border: 1px solid {{line}}; border-radius: 22px; background: transparent; color: {{text}}; font-size: 14px; font-weight: 600; cursor: pointer">Afronden</button>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">Beenpers</h1>
      <div style="flex: none; height: 40px; padding: 0 14px 0 10px; box-sizing: border-box; border-radius: 20px; background: {{surface}}; border: 1px solid {{accent2}}; display: flex; align-items: center; gap: 8px" role="timer" aria-label="Rust, nog 1 minuut 12">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="{{line}}" stroke-width="3"/><circle cx="12" cy="12" r="9" fill="none" stroke="{{accent2}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="31 57" transform="rotate(-90 12 12)"/></svg>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; font-weight: 700; color: {{accent2}}">1:12</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
      <span style="font-size: 14px; color: {{muted}}">Vorige keer: 140 × 8 · 8 · 7</span>
      <span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; background: {{line}}; color: {{accent}}">Doel: 140 kg × 9</span>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; align-items: center; gap: 8px" role="img" aria-label="Set 3 van 4, twee sets klaar">
    <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex: none; background: {{accent}}; color: {{bg}};">1</span><span style="flex: 1; height: 2px; background: {{accent}}"></span><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex: none; background: {{accent}}; color: {{bg}};">2</span><span style="flex: 1; height: 2px; background: {{accent}}"></span><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex: none; border: 2px solid {{accent}}; color: {{accent}};">3</span><span style="flex: 1; height: 2px; background: {{line}}"></span><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex: none; background: {{line}}; color: {{muted}};">4</span>
  </div>

  <div style="margin: 16px 20px 0; background: {{surface}}; border: 1px solid {{line}}; border-radius: 24px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
      <span style="font-size: 13px; font-weight: 600; color: {{text}}">Set 3 van 4</span>
      <span style="font-size: 13px; color: {{muted}}">Vorige keer 140 × 8</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr); gap: 12px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-size: 12px; color: {{muted}}">Gewicht (kg)</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 56px; font-weight: 700; line-height: 1.1">140</span>
        <div style="display: flex; gap: 8px; margin-top: 10px"><button aria-label="Gewicht 2,5 kg minder" style="width: 66px; height: 56px; border: 0; border-radius: 16px; background: {{line}}; color: {{text}}; font-size: 24px; cursor: pointer">−</button><button aria-label="Gewicht 2,5 kg meer" style="width: 66px; height: 56px; border: 0; border-radius: 16px; background: {{line}}; color: {{text}}; font-size: 24px; cursor: pointer">+</button></div>
      </div>
      <div style="background: {{line}}"></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-size: 12px; color: {{muted}}">Herhalingen</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 56px; font-weight: 700; line-height: 1.1">8</span>
        <div style="display: flex; gap: 8px; margin-top: 10px"><button aria-label="Eén herhaling minder" style="width: 66px; height: 56px; border: 0; border-radius: 16px; background: {{line}}; color: {{text}}; font-size: 24px; cursor: pointer">−</button><button aria-label="Eén herhaling meer" style="width: 66px; height: 56px; border: 0; border-radius: 16px; background: {{line}}; color: {{text}}; font-size: 24px; cursor: pointer">+</button></div>
      </div>
    </div>
  </div>

  <div style="padding: 14px 24px 0; display: flex; flex-direction: column">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: {{muted}}">GEDAAN</span>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 40px; border-bottom: 1px solid {{line}}"><span style="font-size: 15px">Set 1 · 140 kg × 8</span><span style="color: {{accent}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
    <div style="display: flex; justify-content: space-between; align-items: center; height: 40px"><span style="font-size: 15px">Set 2 · 140 kg × 8</span><span style="color: {{accent}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></div>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 0 20px 16px; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 64px; border: 0; border-radius: 18px; background: {{accent}}; color: {{bg}}; font-size: 19px; font-weight: 700; cursor: pointer">Set klaar</button>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
      <span style="font-size: 13px; color: {{muted}}; min-width: 0">Straks: Beenstrekken · 3 × 12</span>
      <button style="flex: none; height: 44px; padding: 0 16px; border: 1px solid {{lineStrong}}; border-radius: 22px; background: transparent; color: {{text}}; font-size: 13px; font-weight: 600; cursor: pointer">Oefening overslaan</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0A0E1A","section":"Kleuren"},"surface":{"editor":"color","default":"#131A2B","section":"Kleuren"},"line":{"editor":"color","default":"#26324F","section":"Kleuren"},"lineStrong":{"editor":"color","default":"#5B6C99","section":"Kleuren"},"text":{"editor":"color","default":"#F1F4FB","section":"Kleuren"},"muted":{"editor":"color","default":"#9AA6C2","section":"Kleuren"},"accent":{"editor":"color","default":"#C8F135","section":"Kleuren"},"accent2":{"editor":"color","default":"#7C9CFF","section":"Kleuren"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    return {
      bg: p.bg ?? '#0A0E1A',
      surface: p.surface ?? '#131A2B',
      line: p.line ?? '#26324F',
      lineStrong: p.lineStrong ?? '#5B6C99',
      text: p.text ?? '#F1F4FB',
      muted: p.muted ?? '#9AA6C2',
      accent: p.accent ?? '#C8F135',
      accent2: p.accent2 ?? '#7C9CFF'
    };
  }
}
</script>
</body>
</html>
