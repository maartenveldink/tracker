<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Progressie, gewicht</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; color: {{text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; padding: 0 2px">Progressie</h1>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: {{surface}}; border-radius: 16px; padding: 4px">
      <button style="height: 40px; border: 0; border-radius: 12px; background: transparent; color: {{muted}}; font-size: 14px; cursor: pointer">Oefeningen</button>
      <button style="height: 40px; border: 0; border-radius: 12px; background: transparent; color: {{muted}}; font-size: 14px; cursor: pointer">Overzicht</button>
      <button style="height: 40px; border: 0; border-radius: 12px; background: {{accent}}; color: {{bg}}; font-size: 14px; font-weight: 600; cursor: pointer">Gewicht</button>
    </div>

    <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 20px; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; color: {{muted}}">Gemiddelde van 7 dagen</span>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em">82,4 <span style="font-size: 16px; font-weight: 500; color: {{muted}}">kg</span></span>
        </div>
        <span style="font-size: 13px; color: {{accent2}}">↓ 0,6 kg in 4 weken</span>
      </div>
      <svg viewBox="0 0 320 120" width="100%" height="120" role="img" aria-label="Grafiek van losse metingen en het 7-daags gemiddelde, licht dalend van 83 naar 82,4 kilo">
        <line x1="0" y1="20" x2="320" y2="20" stroke="{{line}}" stroke-width="1"/>
        <line x1="0" y1="65" x2="320" y2="65" stroke="{{line}}" stroke-width="1"/>
        <line x1="0" y1="110" x2="320" y2="110" stroke="{{line}}" stroke-width="1"/>
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="12">
          <circle cx="{{d.x}}" cy="{{d.y}}" r="3" fill="{{muted}}" fill-opacity="0.6"/>
        </sc-for>
        <path d="{{avgPath}}" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; gap: 4px">
          <button style="height: 44px; padding: 0 12px; border: 0; border-radius: 22px; background: {{line}}; color: {{text}}; font-size: 13px; font-weight: 600; cursor: pointer">4 wkn</button>
          <button style="height: 44px; padding: 0 12px; border: 0; border-radius: 22px; background: transparent; color: {{muted}}; font-size: 13px; cursor: pointer">3 mnd</button>
          <button style="height: 44px; padding: 0 12px; border: 0; border-radius: 22px; background: transparent; color: {{muted}}; font-size: 13px; cursor: pointer">Alles</button>
        </div>
        <span style="font-size: 12px; color: {{muted}}">● meting · — gemiddelde</span>
      </div>
    </div>

    <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 600">Nieuwe meting</span>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px">
        <input aria-label="Gewicht in kilogram" placeholder="kg" inputmode="decimal" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{line}}; border-radius: 14px; background: {{bg}}; color: {{text}}; font-size: 16px">
        <button style="height: 48px; padding: 0 20px; border: 0; border-radius: 14px; background: {{accent}}; color: {{bg}}; font-size: 15px; font-weight: 700; cursor: pointer">Opslaan</button>
      </div>
    </div>

    <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 20px; padding: 8px 16px; display: flex; flex-direction: column">
      <sc-for list="{{log}}" as="l" hint-placeholder-count="3">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 14px; min-height: 44px; border-top: {{l.border}}">
          <span style="font-size: 14px; color: {{muted}}">{{l.when}}</span>
          <span style="font-size: 15px; font-weight: 600">{{l.value}}</span>
          <span style="font-size: 12px; width: 52px; text-align: right; color: {{muted}}">{{l.delta}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Hoofdnavigatie" style="height: 76px; box-sizing: border-box; border-top: 1px solid {{line}}; background: {{surface}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 10px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <button style="{{n.style}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{n.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.label}}</button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0A0E1A","section":"Kleuren"},"surface":{"editor":"color","default":"#131A2B","section":"Kleuren"},"line":{"editor":"color","default":"#26324F","section":"Kleuren"},"text":{"editor":"color","default":"#F1F4FB","section":"Kleuren"},"muted":{"editor":"color","default":"#9AA6C2","section":"Kleuren"},"accent":{"editor":"color","default":"#C8F135","section":"Kleuren"},"accent2":{"editor":"color","default":"#7C9CFF","section":"Kleuren"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const c = {
      bg: P.bg ?? '#0A0E1A', surface: P.surface ?? '#131A2B', line: P.line ?? '#26324F',
      text: P.text ?? '#F1F4FB', muted: P.muted ?? '#9AA6C2', accent: P.accent ?? '#C8F135', accent2: P.accent2 ?? '#7C9CFF'
    };
    const ACTIVE = 'Progressie';
    const defs = [
      ['Home', 'M3 11l9-8 9 8M5 10v10h14V10', 1.75],
      ['Train', 'M7 4l13 8-13 8z', 1.75],
      ['Habits', 'M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5', 1.75],
      ['Progressie', 'M3 17l6-6 4 4 8-9M15 6h6v6', 1.75],
      ['Meer', 'M5 12h.01M12 12h.01M19 12h.01', 3.5]
    ];
    const base = 'border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;cursor:pointer;';
    const nav = defs.map((x) => ({ label: x[0], d: x[1], sw: x[2], style: base + 'color:' + (x[0] === ACTIVE ? c.accent + ';font-weight:600;' : c.muted + ';') }));
    const raw = [83.2, 82.8, 83.4, 82.6, 82.9, 82.3, 83.0, 82.5, 82.2, 82.8, 82.1, 82.6, 82.3, 82.5];
    const yOf = (v) => 110 - ((v - 81.5) / 2.5) * 90;
    const xOf = (i) => 10 + i * (300 / (raw.length - 1));
    const dots = raw.map((v, i) => ({ x: xOf(i).toFixed(1), y: yOf(v).toFixed(1) }));
    const avg = raw.map((v, i) => {
      const s = raw.slice(Math.max(0, i - 6), i + 1);
      return s.reduce((a, b) => a + b, 0) / s.length;
    });
    const avgPath = avg.map((v, i) => (i ? 'L' : 'M') + xOf(i).toFixed(1) + ' ' + yOf(v).toFixed(1)).join(' ');
    const log = [
      { when: 'Vandaag', value: '82,5 kg', delta: '+0,2', border: 'none' },
      { when: 'Gisteren', value: '82,3 kg', delta: '−0,3', border: '1px solid ' + c.line },
      { when: '6 nov', value: '82,6 kg', delta: '+0,5', border: '1px solid ' + c.line }
    ];
    return Object.assign({}, c, { nav, dots, avgPath, log });
  }
}
</script>
</body>
</html>
