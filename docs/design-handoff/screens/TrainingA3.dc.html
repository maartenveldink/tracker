<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Training – A3 Grote bediening onder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{bg}}; color: {{text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: {{muted}}">Benen · oefening 3 van 6</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">42:18</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="Oefeningen in deze training" style="width: 44px; height: 44px; border: 1px solid {{line}}; border-radius: 22px; background: transparent; color: {{text}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
      </button>
      <button style="height: 44px; padding: 0 18px; border: 1px solid {{line}}; border-radius: 22px; background: transparent; color: {{text}}; font-size: 14px; font-weight: 600; cursor: pointer">Afronden</button>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">Beenpers</h1>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; background: {{line}}; color: {{accent}}">Doel: 140 kg × 9</span>
      <span style="font-size: 13px; color: {{muted}}">Set 3 van 4</span>
    </div>
  </div>

  <div style="margin: 16px 20px 0; background: {{surface}}; border: 1px solid {{line}}; border-radius: 20px; padding: 8px 6px">
    <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 56px; padding: 4px 10px 6px; font-size: 12px; color: {{muted}}"><span>Set</span><span>Vandaag</span><span>Vorige keer</span><span></span></div>
      <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 56px; align-items: center; height: 44px; padding: 0 10px;"><span style="font-size: 14px; color: {{muted}}">1</span><span style="font-size: 17px; font-weight: 500; color: {{text}}">140 × 8</span><span style="font-size: 15px; color: {{muted}}">140 × 8</span><span style="font-size: 13px; text-align: right; color: {{muted}}">gelijk</span></div>
      <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 56px; align-items: center; height: 44px; padding: 0 10px;"><span style="font-size: 14px; color: {{muted}}">2</span><span style="font-size: 17px; font-weight: 500; color: {{text}}">140 × 8</span><span style="font-size: 15px; color: {{muted}}">140 × 8</span><span style="font-size: 13px; text-align: right; color: {{muted}}">gelijk</span></div>
      <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 56px; align-items: center; height: 44px; padding: 0 10px; background: {{bg}}; border-radius: 12px; outline: 2px solid {{accent}}; outline-offset: -2px;"><span style="font-size: 14px; color: {{muted}}">3</span><span style="font-size: 17px; font-weight: 500; color: {{accent}}">140 × 8</span><span style="font-size: 15px; color: {{muted}}">140 × 7</span><span style="font-size: 13px; text-align: right; color: {{muted}}">nu</span></div>
      <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 56px; align-items: center; height: 44px; padding: 0 10px;"><span style="font-size: 14px; color: {{muted}}">4</span><span style="font-size: 17px; font-weight: 500; color: {{text}}">–</span><span style="font-size: 15px; color: {{muted}}">–</span><span style="font-size: 13px; text-align: right; color: {{muted}}"></span></div>

  </div>
  <div style="padding: 0 20px; display: flex; justify-content: space-between">
    <button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{accent}}; font-size: 14px; font-weight: 600; cursor: pointer">+ Set toevoegen</button>
    <button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{muted}}; font-size: 14px; cursor: pointer">Laatste set weghalen</button>
  </div>

  <div style="flex: 1"></div>
  <div style="background: {{surface}}; border-top: 1px solid {{line}}; border-radius: 28px 28px 0 0; padding: 16px 20px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="background: {{bg}}; border-radius: 20px; padding: 10px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-size: 12px; color: {{muted}}">Gewicht (kg)</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 44px; font-weight: 700; line-height: 1.15">140</span>
        <div style="display: flex; gap: 8px; margin-top: 6px"><button aria-label="Gewicht 2,5 kg minder" style="width: 70px; height: 52px; border: 0; border-radius: 14px; background: {{line}}; color: {{text}}; font-size: 24px; cursor: pointer">−</button><button aria-label="Gewicht 2,5 kg meer" style="width: 70px; height: 52px; border: 0; border-radius: 14px; background: {{line}}; color: {{text}}; font-size: 24px; cursor: pointer">+</button></div>
      </div>
      <div style="background: {{bg}}; border-radius: 20px; padding: 10px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-size: 12px; color: {{muted}}">Herhalingen</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 44px; font-weight: 700; line-height: 1.15">8</span>
        <div style="display: flex; gap: 8px; margin-top: 6px"><button aria-label="Eén herhaling minder" style="width: 70px; height: 52px; border: 0; border-radius: 14px; background: {{line}}; color: {{text}}; font-size: 24px; cursor: pointer">−</button><button aria-label="Eén herhaling meer" style="width: 70px; height: 52px; border: 0; border-radius: 14px; background: {{line}}; color: {{text}}; font-size: 24px; cursor: pointer">+</button></div>
      </div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center">
      <button aria-label="Rust, nog 1 minuut 12. Tik voor 30 seconden extra" style="flex: none; width: 64px; height: 64px; border: 0; border-radius: 32px; background: transparent; cursor: pointer; position: relative; padding: 0">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="none" stroke="{{line}}" stroke-width="5"/><circle cx="32" cy="32" r="28" fill="none" stroke="{{accent2}}" stroke-width="5" stroke-linecap="round" stroke-dasharray="97 176" transform="rotate(-90 32 32)"/></svg>
        <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 17px; font-weight: 700; color: {{accent2}}">1:12</span>
      </button>
      <button style="flex: 1; height: 64px; border: 0; border-radius: 18px; background: {{accent}}; color: {{bg}}; font-size: 19px; font-weight: 700; cursor: pointer">Set klaar</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
      <span style="font-size: 13px; color: {{muted}}; min-width: 0">Straks: Beenstrekken · 3 × 12</span>
      <button style="flex: none; height: 44px; padding: 0 16px; border: 1px solid {{lineStrong}}; border-radius: 22px; background: transparent; color: {{text}}; font-size: 13px; font-weight: 600; cursor: pointer">Oefening overslaan</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0A0E1A","section":"Kleuren"},"surface":{"editor":"color","default":"#131A2B","section":"Kleuren"},"line":{"editor":"color","default":"#26324F","section":"Kleuren"},"lineStrong":{"editor":"color","default":"#5B6C99","section":"Kleuren"},"text":{"editor":"color","default":"#F1F4FB","section":"Kleuren"},"muted":{"editor":"color","default":"#9AA6C2","section":"Kleuren"},"accent":{"editor":"color","default":"#C8F135","section":"Kleuren"},"accent2":{"editor":"color","default":"#7C9CFF","section":"Kleuren"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    return {
      bg: p.bg ?? '#0A0E1A',
      surface: p.surface ?? '#131A2B',
      line: p.line ?? '#26324F',
      lineStrong: p.lineStrong ?? '#5B6C99',
      text: p.text ?? '#F1F4FB',
      muted: p.muted ?? '#9AA6C2',
      accent: p.accent ?? '#C8F135',
      accent2: p.accent2 ?? '#7C9CFF'
    };
  }
}
</script>
</body>
</html>
