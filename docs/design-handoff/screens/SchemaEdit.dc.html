<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Schema bewerken</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; color: {{text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center">
      <button aria-label="Terug naar schema's" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{text}}; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span style="text-align: center; font-size: 16px; font-weight: 600">Schema bewerken</span>
      <span></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="naam" style="font-size: 12px; color: {{muted}}; padding: 0 2px">Naam van het schema</label>
      <input id="naam" value="Kracht 3 dagen" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{line}}; border-radius: 14px; background: {{surface}}; color: {{text}}; font-size: 17px; font-weight: 600">
    </div>

    <div style="display: flex; gap: 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px">
        <span style="font-size: 14px; font-weight: 600">Training A · Benen</span>
        <span style="font-size: 13px; color: {{muted}}">6 oefeningen</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{rows}}" as="x" hint-placeholder-count="5">
        <div style="min-height: 56px; box-sizing: border-box; padding: 0 4px 0 6px; border-radius: 14px; background: {{surface}}; border: 1px solid {{line}}; display: grid; grid-template-columns: 36px minmax(0, 1fr) 44px; align-items: center; gap: 4px">
          <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; color: {{muted}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 15px; font-weight: 600">{{x.name}}</span>
            <span style="font-size: 12px; color: {{muted}}">{{x.meta}}</span>
          </span>
          <button aria-label="Verwijder {{x.name}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{muted}}; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </sc-for>
      <button style="height: 52px; border: 1px dashed {{accent}}; border-radius: 14px; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 600; cursor: pointer">+ Oefening toevoegen</button>
    </div>
  </div>

  <div style="background: {{surface}}; border-top: 1px solid {{line}}; padding: 14px 20px 22px; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 56px; border: 0; border-radius: 16px; background: {{accent}}; color: {{bg}}; font-size: 17px; font-weight: 700; cursor: pointer">Opslaan</button>
    <button style="height: 44px; border: 0; background: transparent; color: {{muted}}; font-size: 14px; cursor: pointer">Training A verwijderen</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0A0E1A","section":"Kleuren"},"surface":{"editor":"color","default":"#131A2B","section":"Kleuren"},"line":{"editor":"color","default":"#26324F","section":"Kleuren"},"text":{"editor":"color","default":"#F1F4FB","section":"Kleuren"},"muted":{"editor":"color","default":"#9AA6C2","section":"Kleuren"},"accent":{"editor":"color","default":"#C8F135","section":"Kleuren"},"accent2":{"editor":"color","default":"#7C9CFF","section":"Kleuren"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const c = {
      bg: P.bg ?? '#0A0E1A', surface: P.surface ?? '#131A2B', line: P.line ?? '#26324F',
      text: P.text ?? '#F1F4FB', muted: P.muted ?? '#9AA6C2', accent: P.accent ?? '#C8F135', accent2: P.accent2 ?? '#7C9CFF'
    };
    const tb = 'height: 44px; min-width: 44px; padding: 0 16px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; ';
    const tabs = [
      { label: 'A', style: tb + 'border: 0; background: ' + c.accent + '; color: ' + c.bg + ';' },
      { label: 'B', style: tb + 'border: 1px solid ' + c.line + '; background: transparent; color: ' + c.text + ';' },
      { label: 'C', style: tb + 'border: 1px solid ' + c.line + '; background: transparent; color: ' + c.text + ';' },
      { label: '+', style: tb + 'border: 1px dashed ' + c.line + '; background: transparent; color: ' + c.muted + ';' }
    ];
    const rows = [
      { name: 'Squat', meta: '3 × 8 · rust 2:00' },
      { name: 'Romeinse deadlift', meta: '3 × 10 · rust 1:30' },
      { name: 'Beenpers', meta: '3 × 8 · rust 1:30' },
      { name: 'Beenstrekken', meta: '3 × 12 · rust 1:00' },
      { name: 'Beencurl', meta: '3 × 12 · rust 1:00' },
      { name: 'Kuitheffen', meta: '3 × 15 · rust 1:00' }
    ];
    return Object.assign({}, c, { tabs, rows });
  }
}
</script>
</body>
</html>
