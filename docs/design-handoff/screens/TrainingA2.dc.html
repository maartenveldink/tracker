<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Training – A2 Rust in de knop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{bg}}; color: {{text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: {{muted}}">Benen · oefening 3 van 6</span>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">42:18</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="Oefeningen in deze training" style="width: 44px; height: 44px; border: 1px solid {{line}}; border-radius: 22px; background: transparent; color: {{text}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
      </button>
      <button style="height: 44px; padding: 0 18px; border: 1px solid {{line}}; border-radius: 22px; background: transparent; color: {{text}}; font-size: 14px; font-weight: 600; cursor: pointer">Afronden</button>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">Beenpers</h1>
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
      <span style="font-size: 14px; color: {{muted}}">Vorige keer: 140 × 8 · 8 · 7</span>
      <span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; background: {{line}}; color: {{accent}}">Doel: 140 kg × 9</span>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 8px">
      <div style="min-height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: {{surface}}"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: {{accent}}; color: {{bg}}">1</span><span style="font-size: 17px; font-weight: 500">140 kg × 8</span><span style="font-size: 13px; color: {{muted}}">Klaar</span></div>
      <div style="min-height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: {{surface}}"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: {{accent}}; color: {{bg}}">2</span><span style="font-size: 17px; font-weight: 500">140 kg × 8</span><span style="font-size: 13px; color: {{muted}}">Klaar</span></div>
      <div style="min-height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 64px; background: {{bg}}; border: 2px solid {{accent}}"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 2px solid {{accent}}; color: {{accent}}">3</span>
        <div style="display: flex; align-items: center; gap: 8px">
          <button aria-label="Gewicht aanpassen, nu 140 kilo" style="height: 36px; padding: 0 12px; border: 1px dashed {{lineStrong}}; border-radius: 10px; background: {{surface}}; color: {{text}}; font-size: 17px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">140 kg <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
          <span style="color: {{muted}}" aria-hidden="true">×</span>
          <button aria-label="Herhalingen aanpassen, nu 8" style="height: 36px; padding: 0 12px; border: 1px dashed {{lineStrong}}; border-radius: 10px; background: {{surface}}; color: {{text}}; font-size: 17px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">8 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
        </div>
        <span style="font-size: 13px; font-weight: 700; color: {{accent}}">Nu</span>
      </div>
      <div style="min-height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: transparent; border: 1px dashed {{lineStrong}}; color: {{muted}}"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: {{line}}; color: {{muted}}">4</span><span style="font-size: 17px; font-weight: 500">140 kg × 8</span><span></span></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px">
      <button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{accent}}; font-size: 14px; font-weight: 600; cursor: pointer">+ Set toevoegen</button>
      <button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{muted}}; font-size: 14px; cursor: pointer">Laatste set weghalen</button>
    </div>
  </div>

  <div style="flex: 1"></div>
  <div style="background: {{surface}}; border-top: 1px solid {{line}}; border-radius: 28px 28px 0 0; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 8px">
    <button aria-label="Rust, nog 1 minuut 12. Tik om over te slaan" style="position: relative; overflow: hidden; height: 64px; border: 2px solid {{accent2}}; border-radius: 18px; background: {{bg}}; color: {{text}}; cursor: pointer; padding: 0 20px; display: flex; align-items: center; justify-content: space-between">
      <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 55%; background: {{accent2}}; opacity: 0.28"></span>
      <span style="position: relative; display: flex; align-items: baseline; gap: 10px"><span style="font-size: 15px; color: {{muted}}">Rust</span><span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; color: {{accent2}}">1:12</span></span>
      <span style="position: relative; font-size: 15px; font-weight: 600">Start set 3</span>
    </button>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
      <span style="font-size: 13px; color: {{muted}}; min-width: 0">Straks: Beenstrekken · 3 × 12</span>
      <button style="flex: none; height: 44px; padding: 0 16px; border: 1px solid {{lineStrong}}; border-radius: 22px; background: transparent; color: {{text}}; font-size: 13px; font-weight: 600; cursor: pointer">Oefening overslaan</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0A0E1A","section":"Kleuren"},"surface":{"editor":"color","default":"#131A2B","section":"Kleuren"},"line":{"editor":"color","default":"#26324F","section":"Kleuren"},"lineStrong":{"editor":"color","default":"#5B6C99","section":"Kleuren"},"text":{"editor":"color","default":"#F1F4FB","section":"Kleuren"},"muted":{"editor":"color","default":"#9AA6C2","section":"Kleuren"},"accent":{"editor":"color","default":"#C8F135","section":"Kleuren"},"accent2":{"editor":"color","default":"#7C9CFF","section":"Kleuren"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    return {
      bg: p.bg ?? '#0A0E1A',
      surface: p.surface ?? '#131A2B',
      line: p.line ?? '#26324F',
      lineStrong: p.lineStrong ?? '#5B6C99',
      text: p.text ?? '#F1F4FB',
      muted: p.muted ?? '#9AA6C2',
      accent: p.accent ?? '#C8F135',
      accent2: p.accent2 ?? '#7C9CFF'
    };
  }
}
</script>
</body>
</html>
