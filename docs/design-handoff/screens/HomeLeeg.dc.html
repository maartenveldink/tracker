<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Home, lege toestand</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; color: {{text}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 2px 4px">
      <span style="font-size: 13px; color: {{muted}}">Zondag 8 november</span>
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Vandaag</h1>
    </div>

    <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Begin je eerste training</span>
        <span style="font-size: 14px; line-height: 1.5; color: {{muted}}">Je hebt nog niets gelogd. Start meteen zonder schema, of maak eerst een schema aan.</span>
      </div>
      <button style="height: 56px; border: 0; border-radius: 16px; background: {{accent}}; color: {{bg}}; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
        Start vrije training
      </button>
      <button style="height: 48px; border: 1px solid {{line}}; border-radius: 16px; background: transparent; color: {{text}}; font-size: 15px; font-weight: 600; cursor: pointer">Schema maken</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
        <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700; color: {{muted}}">–</span>
          <span style="font-size: 12px; color: {{muted}}">{{t.label}}</span>
        </div>
      </sc-for>
    </div>

    <div style="background: {{surface}}; border: 1px solid {{line}}; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 600">Snel wegen</span>
        <span style="font-size: 13px; color: {{muted}}">Log je eerste meting, dan zie je het verloop in Progressie.</span>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px">
        <input aria-label="Gewicht in kilogram" placeholder="kg" inputmode="decimal" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{line}}; border-radius: 14px; background: {{bg}}; color: {{text}}; font-size: 16px">
        <button style="height: 48px; padding: 0 20px; border: 0; border-radius: 14px; background: {{accent}}; color: {{bg}}; font-size: 15px; font-weight: 700; cursor: pointer">Opslaan</button>
      </div>
    </div>
  </div>

  <nav aria-label="Hoofdnavigatie" style="height: 76px; box-sizing: border-box; border-top: 1px solid {{line}}; background: {{surface}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 10px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <button style="{{n.style}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{n.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.label}}</button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0A0E1A","section":"Kleuren"},"surface":{"editor":"color","default":"#131A2B","section":"Kleuren"},"line":{"editor":"color","default":"#26324F","section":"Kleuren"},"text":{"editor":"color","default":"#F1F4FB","section":"Kleuren"},"muted":{"editor":"color","default":"#9AA6C2","section":"Kleuren"},"accent":{"editor":"color","default":"#C8F135","section":"Kleuren"},"accent2":{"editor":"color","default":"#7C9CFF","section":"Kleuren"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const c = {
      bg: P.bg ?? '#0A0E1A', surface: P.surface ?? '#131A2B', line: P.line ?? '#26324F',
      text: P.text ?? '#F1F4FB', muted: P.muted ?? '#9AA6C2', accent: P.accent ?? '#C8F135', accent2: P.accent2 ?? '#7C9CFF'
    };
    const ACTIVE = 'Home';
    const defs = [
      ['Home', 'M3 11l9-8 9 8M5 10v10h14V10', 1.75],
      ['Train', 'M7 4l13 8-13 8z', 1.75],
      ['Habits', 'M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5', 1.75],
      ['Progressie', 'M3 17l6-6 4 4 8-9M15 6h6v6', 1.75],
      ['Meer', 'M5 12h.01M12 12h.01M19 12h.01', 3.5]
    ];
    const base = 'border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;cursor:pointer;';
    const nav = defs.map((x) => ({ label: x[0], d: x[1], sw: x[2], style: base + 'color:' + (x[0] === ACTIVE ? c.accent + ';font-weight:600;' : c.muted + ';') }));
    const tiles = [{ label: 'weken streak' }, { label: 'volume' }, { label: 'gewicht' }];
    return Object.assign({}, c, { nav, tiles });
  }
}
</script>
</body>
</html>
